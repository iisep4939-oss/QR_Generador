<script>
    // ==================== VARIABLES GLOBALES ====================
    let supabaseClient = null;   // renombrado para evitar shadowing
    let selectedFile = null;
    let WEB_URL = "";
    const MAX_FILE_SIZE = 10 * 1024 * 1024; // 10 MB

    // ==================== INICIALIZACIÓN ====================
    document.addEventListener('DOMContentLoaded', function () {
        // 1. Cargar credenciales / conexión
        loadCredentials();

        // 2. Favicon dinámico
        const savedFavicon = localStorage.getItem('custom_favicon');
        if (savedFavicon) {
            let link = document.querySelector("link[rel~='icon']");
            if (!link) {
                link = document.createElement('link');
                link.rel = 'icon';
                document.head.appendChild(link);
            }
            link.href = savedFavicon;
        }

        // 3. Setup inicial
        setDefaultDateLong();
        toggleEstudioInputs();

        // ==================== EVENT LISTENERS ====================
        // Header
        document.getElementById('btnConfigurar').addEventListener('click', openCredentialsModal);

        // Modal de credenciales
        document.getElementById('btnCancelarCredenciales').addEventListener('click', closeCredentialsModal);
        document.getElementById('btnGuardarCredenciales').addEventListener('click', saveCredentials);

        // Tipo de estudio (radio buttons)
        document.querySelectorAll('input[name="tipoEstudio"]').forEach(radio => {
            radio.addEventListener('change', toggleEstudioInputs);
        });

        // Fecha
        const fechaInput = document.getElementById('fecha_emision_texto');
        document.getElementById('btnToggleFecha').addEventListener('click', toggleDateFormat);
        fechaInput.addEventListener('blur', function () {
            const fecha = this.value.trim();
            if (fecha && detectDateFormat(fecha) === 'desconocido') {
                showStatus('warning', '⚠ Formato de fecha no reconocido. Use "dd/mm/aa" o "día de mes de año"');
            }
        });

        // Panel configuración QR
        document.getElementById('btnToggleConfig').addEventListener('click', toggleConfig);

        // Input PDF
        document.getElementById('pdfInput').addEventListener('change', handleFileSelect);

        // Generar
        document.getElementById('generateBtn').addEventListener('click', generateCertificate);

        // Reset
        document.getElementById('btnReset').addEventListener('click', resetApp);
    });

    // ==================== FECHA ====================
    function setDefaultDateLong() {
        document.getElementById('fecha_emision_texto').value = new Date().toLocaleDateString('es-PE', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });
    }

    function detectDateFormat(fechaStr) {
        const mesesLargos = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio',
                             'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
        const fechaMin = fechaStr.toLowerCase();
        const esFormatoLargo = mesesLargos.some(mes => fechaMin.includes(mes));
        const regexCorto = /^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/;
        const esFormatoCorto = regexCorto.test(fechaStr);

        if (esFormatoLargo) return 'largo';
        if (esFormatoCorto) return 'corto';
        return 'desconocido';
    }

    function convertirFormatoFecha(fechaStr, formatoOrigen) {
        let fechaObj;

        try {
            if (formatoOrigen === 'largo') {
                const fechaNormalizada = fechaStr.replace(/ de /g, ' ').replace(/,/g, '');
                fechaObj = new Date(fechaNormalizada);

                if (isNaN(fechaObj.getTime())) {
                    const partes = fechaNormalizada.split(' ');
                    if (partes.length >= 3) {
                        const dia = parseInt(partes[0]);
                        const mes = convertirMesATexto(partes[1]);
                        const año = parseInt(partes[2]);
                        fechaObj = new Date(año, mes, dia);
                    }
                }

                const dia = String(fechaObj.getDate()).padStart(2, '0');
                const mes = String(fechaObj.getMonth() + 1).padStart(2, '0');
                const año = String(fechaObj.getFullYear()).slice(-2);
                return `${dia}/${mes}/${año}`;

            } else if (formatoOrigen === 'corto') {
                const partes = fechaStr.split('/');
                let dia = parseInt(partes[0]);
                let mes = parseInt(partes[1]) - 1;
                let año = parseInt(partes[2]);

                if (año < 100) {
                    año = año < 50 ? 2000 + año : 1900 + año;
                }

                fechaObj = new Date(año, mes, dia);
                const opciones = { year: 'numeric', month: 'long', day: 'numeric' };
                return fechaObj.toLocaleDateString('es-PE', opciones);
            }
        } catch (error) {
            console.error('Error al convertir fecha:', error);
        }

        return fechaStr;
    }

    function convertirMesATexto(mesTexto) {
        const meses = {
            'enero': 0, 'febrero': 1, 'marzo': 2, 'abril': 3, 'mayo': 4, 'junio': 5,
            'julio': 6, 'agosto': 7, 'septiembre': 8, 'octubre': 9, 'noviembre': 10, 'diciembre': 11
        };
        return meses[mesTexto.toLowerCase()] || 0;
    }

    function toggleDateFormat() {
        const el = document.getElementById('fecha_emision_texto');
        const fechaActual = el.value.trim();

        if (!fechaActual) {
            setDefaultDateLong();
            return;
        }

        const formatoActual = detectDateFormat(fechaActual);

        if (formatoActual === 'desconocido') {
            showStatus('error', 'Formato de fecha no reconocido. Usando fecha actual.');
            setDefaultDateLong();
            return;
        }

        const fechaConvertida = convertirFormatoFecha(fechaActual, formatoActual);

        if (fechaConvertida && fechaConvertida !== fechaActual) {
            el.value = fechaConvertida;
            const mensaje = formatoActual === 'largo'
                ? 'Cambiado a formato corto (dd/mm/yy)'
                : 'Cambiado a formato largo (día de mes de año)';
            showStatus('info', `✓ ${mensaje}`);
        }
    }

    // ==================== TIPO DE ESTUDIO ====================
    function toggleEstudioInputs() {
        const tipo = document.querySelector('input[name="tipoEstudio"]:checked').value;
        const carreraGroup = document.getElementById('carreraGroup');
        const moduloGroup = document.getElementById('moduloGroup');

        if (tipo === 'carrera') {
            carreraGroup.classList.remove('hidden');
            moduloGroup.classList.add('hidden');
            document.getElementById('modulo_curso').value = '';
        } else {
            carreraGroup.classList.add('hidden');
            moduloGroup.classList.remove('hidden');
            document.getElementById('carrera').value = '';
        }
    }

    // ==================== CREDENCIALES ====================
    function loadCredentials() {
        const storedUrl = localStorage.getItem('supabase_url');
        const storedKey = localStorage.getItem('supabase_key');
        const storedWeb = localStorage.getItem('web_url');

        if (storedUrl && storedKey) {
            initSupabase(storedUrl, storedKey);
            WEB_URL = storedWeb || "";
            updateStatus(true);
        } else {
            openCredentialsModal();
            updateStatus(false);
        }
    }

    function openCredentialsModal() {
        document.getElementById('credentialsModal').classList.remove('hidden');
        document.getElementById('inputUrl').value = localStorage.getItem('supabase_url') || '';
        document.getElementById('inputKey').value = localStorage.getItem('supabase_key') || '';
        document.getElementById('inputWeb').value = localStorage.getItem('web_url') || '';
    }

    function closeCredentialsModal() {
        document.getElementById('credentialsModal').classList.add('hidden');
    }

    function saveCredentials() {
        const url = document.getElementById('inputUrl').value.trim();
        const key = document.getElementById('inputKey').value.trim();
        const web = document.getElementById('inputWeb').value.trim();

        if (!url || !key) {
            showStatus('error', 'Faltan credenciales');
            return;
        }

        localStorage.setItem('supabase_url', url);
        localStorage.setItem('supabase_key', key);
        localStorage.setItem('web_url', web);
        WEB_URL = web;
        initSupabase(url, key);
        closeCredentialsModal();
        updateStatus(true);
    }

    function initSupabase(url, key) {
        try {
            supabaseClient = window.supabase.createClient(url, key);
        } catch (error) {
            console.error('Error al inicializar Supabase:', error);
            updateStatus(false);
        }
    }

    function updateStatus(isConnected) {
        const status = document.getElementById('systemStatus');
        const dot = document.getElementById('statusDot');
        const text = document.getElementById('statusText');

        if (isConnected) {
            dot.classList.remove('disconnected');
            dot.classList.add('connected');
            text.textContent = "Conectado";
            text.classList.remove('text-gray-700');
            text.classList.add('text-green-700');
            status.classList.remove('bg-white');
            status.classList.add('bg-green-50');
        } else {
            dot.classList.remove('connected');
            dot.classList.add('disconnected');
            text.textContent = "Sin Conexión";
            text.classList.remove('text-green-700');
            text.classList.add('text-gray-700');
            status.classList.remove('bg-green-50');
            status.classList.add('bg-white');
        }
    }

    // ==================== UI ====================
    function toggleConfig() {
        document.getElementById('configPanel').classList.toggle('hidden');
    }

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        // Validar tipo
        if (file.type !== 'application/pdf') {
            showStatus('error', 'Solo se permiten archivos PDF');
            event.target.value = '';
            return;
        }

        // Validar tamaño
        if (file.size > MAX_FILE_SIZE) {
            showStatus('error', 'El archivo supera los 10MB permitidos');
            event.target.value = '';
            return;
        }

        selectedFile = file;
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const fileNameText = document.getElementById('fileNameText');
        fileNameText.textContent = file.name;
        fileNameDisplay.classList.remove('hidden');

        const badge = document.getElementById('previewBadge');
        badge.textContent = "Documento Listo";
        badge.className = "preview-badge bg-gradient-to-r from-green-100 to-emerald-200 text-emerald-800";

        document.getElementById('generateBtn').disabled = false;

        const fileURL = URL.createObjectURL(file);
        const previewFrame = document.getElementById('pdfPreview');
        previewFrame.src = fileURL + "#toolbar=0&navpanes=0";
        previewFrame.classList.remove('hidden');
        document.getElementById('emptyState').classList.add('hidden');
        document.getElementById('actionsPanel').classList.add('hidden');
    }

    function showStatus(type, message) {
        const el = document.getElementById('statusMessage');
        el.textContent = message;

        const clases = {
            'error':   'mb-5 rounded-lg p-4 text-sm font-medium bg-gradient-to-r from-red-50 to-red-100 text-red-800 border border-red-200',
            'success': 'mb-5 rounded-lg p-4 text-sm font-medium bg-gradient-to-r from-green-50 to-emerald-100 text-emerald-800 border border-emerald-200',
            'info':    'mb-5 rounded-lg p-4 text-sm font-medium bg-gradient-to-r from-blue-50 to-blue-100 text-blue-800 border border-blue-200',
            'warning': 'mb-5 rounded-lg p-4 text-sm font-medium bg-gradient-to-r from-yellow-50 to-amber-100 text-amber-800 border border-amber-200'
        };

        el.className = clases[type] || clases.info;
        el.classList.remove('hidden');

        if (type === 'info' || type === 'warning') {
            setTimeout(() => el.classList.add('hidden'), 4000);
        }
    }

    function toggleLoading(isLoading) {
        const btn = document.getElementById('generateBtn');
        if (isLoading) {
            btn.innerHTML = `<div class="animate-spin-slow h-5 w-5 border-2 border-white border-t-transparent rounded-full mr-2"></div> Procesando...`;
            btn.disabled = true;
        } else {
            btn.innerHTML = `<span>Generar Certificado</span><i class="fas fa-arrow-right"></i>`;
            btn.disabled = false;
        }
    }

    function resetApp() {
        document.getElementById('certForm').reset();
        document.getElementById('pdfInput').value = '';
        selectedFile = null;
        document.getElementById('fileNameDisplay').classList.add('hidden');
        document.getElementById('generateBtn').disabled = true;
        document.getElementById('emptyState').classList.remove('hidden');
        document.getElementById('pdfPreview').classList.add('hidden');
        document.getElementById('actionsPanel').classList.add('hidden');
        document.getElementById('statusMessage').classList.add('hidden');
        setDefaultDateLong();
        document.querySelector('input[name="tipoEstudio"][value="modulo"]').checked = true;
        toggleEstudioInputs();

        const badge = document.getElementById('previewBadge');
        badge.textContent = "Esperando Archivo";
        badge.className = "preview-badge bg-gradient-to-r from-gray-100 to-gray-200 text-gray-700";
    }

    // ==================== GENERAR CERTIFICADO ====================
    async function generateCertificate() {
        if (!selectedFile) return;

        if (!supabaseClient) {
            showStatus('error', 'Error de conexión');
            openCredentialsModal();
            return;
        }

        toggleLoading(true);

        try {
            const nombre = document.getElementById('nombre_completo').value.toUpperCase();
            const dni = document.getElementById('dni').value;
            const codigo = document.getElementById('codigo_interno').value;
            const fecha = document.getElementById('fecha_emision_texto').value;
            const firma = document.getElementById('firma_autoridad').value;

            let carrera = document.getElementById('carrera').value;
            let modulo = document.getElementById('modulo_curso').value;

            if (!carrera) carrera = null;
            if (!modulo) modulo = null;

            if (!nombre || !dni) throw new Error("Faltan datos obligatorios");

            // Insertar en Supabase
            const { data, error } = await supabaseClient
                .from('certificados')
                .insert([{
                    nombre_completo: nombre,
                    dni: dni,
                    modulo_curso: modulo,
                    carrera: carrera,
                    fecha_emision_texto: fecha,
                    firma_autoridad: firma,
                    codigo_interno: codigo
                }])
                .select()
                .single();

            if (error) throw error;

            // Generar QR
            const uuid = data.uuid_publico;
            const cleanWebUrl = WEB_URL.replace(/\/$/, "");
            const validationLink = `${cleanWebUrl}?id=${uuid}`;
            const qrDataUrl = await QRCode.toDataURL(validationLink, {
                errorCorrectionLevel: 'H',
                margin: 0,
                width: 300,
                color: { dark: '#000000', light: '#00000000' }
            });

            // Modificar PDF
            const arrayBuffer = await selectedFile.arrayBuffer();
            const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
            const qrImage = await pdfDoc.embedPng(qrDataUrl);

            const config = {
                x: parseInt(document.getElementById('qrX').value),
                y: parseInt(document.getElementById('qrY').value),
                size: parseInt(document.getElementById('qrSize').value),
                page: parseInt(document.getElementById('qrPage').value),
                whiteBg: document.getElementById('whiteBg').checked
            };

            const pages = pdfDoc.getPages();
            const pageIndex = Math.min(config.page, pages.length - 1);
            const page = pages[pageIndex];

            if (config.whiteBg) {
                page.drawRectangle({
                    x: config.x - 2,
                    y: config.y - 2,
                    width: config.size + 4,
                    height: config.size + 4,
                    color: PDFLib.rgb(1, 1, 1)
                });
            }

            page.drawImage(qrImage, {
                x: config.x,
                y: config.y,
                width: config.size,
                height: config.size
            });

            const pdfBytes = await pdfDoc.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);

            const previewFrame = document.getElementById('pdfPreview');
            previewFrame.src = url + "#toolbar=0&navpanes=0";

            const badge = document.getElementById('previewBadge');
            badge.textContent = "CERTIFICADO GENERADO";
            badge.className = "preview-badge bg-gradient-to-r from-blue-100 to-indigo-200 text-blue-800";

            const downloadLink = document.getElementById('downloadLink');
            downloadLink.href = url;
            downloadLink.download = `Certificado_${dni}.pdf`;

            document.getElementById('actionsPanel').classList.remove('hidden');
            showStatus('success', '✓ Certificado generado correctamente');

        } catch (err) {
            console.error(err);
            showStatus('error', '✗ ' + (err.message || 'Error al generar el certificado'));
        } finally {
            toggleLoading(false);
        }
    }
</script>
